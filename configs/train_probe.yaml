# ============================================================
# Phase E Probe Config — 2 epochs to verify pipeline
# ============================================================

project:
  name: "probe-phase-e"
  seed: 42
  output_dir: "outputs/probe/"
  checkpoint_dir: "outputs/probe/checkpoints/"
  log_dir: "outputs/probe/logs/"

data:
  train_csv:       "data/train_probe.csv"
  val_csv:         "data/val_probe.csv"
  test_csv:        "data/test.csv"
  predictions_csv: "outputs/probe/test_predictions.csv"
  sequence_col:    "sequence"
  smiles_col:      "reactant_smiles"
  target_col:      "log10_value"
  ph_col:          "ph"
  temp_col:        "temperature"
  max_seq_len:     1024
  num_workers:     4
  pin_memory:      true

model:
  esm3_variant: "esm3_sm_open_v1"
  d_esm3:       1536

  esm3_lora:
    enabled:        true
    r:              4
    alpha:          8
    dropout:        0.05
    target_modules: ["layernorm_qkv.1"]

  substrate_encoder: "biot5"
  biot5_model:       "QizhiPei/biot5-plus-base-mol-instructions-molecule"
  biot5_max_length:  192
  d_substrate:       768

  biot5_lora:
    enabled:        true
    r:              8
    alpha:          16
    dropout:        0.05    # M-02: added Session 9; matches esm3_lora dropout for consistency
    target_modules: ["q", "k", "v", "o"]
  d_proj:            512
  d_fusion:          512
  d_cond:            256

  projection_normalize_input: true

  cross_attention:
    d_sub:   512
    d_prot:  1536
    n_heads: 8
    dropout: 0.1

  mlp:
    hidden_dims: [512, 256, 128]
    dropouts:    [0.3, 0.2, 0.1]
    activation:  "gelu"

training:
  num_gpus:    2
  ddp_backend: "nccl"
  precision:   "bf16-mixed"
  find_unused_parameters: false

  batch_size_per_gpu:          2
  gradient_accumulation_steps: 8
  effective_batch_size:        32  # 2×2×8 — more representative of production gradient scale

  max_epochs:         2
  val_every_n_epochs: 1

  loss:       "mse"
  huber_beta: 1.0

  gradient_clip_norm: 1.0

  lr:
    task:       1.2e-4
    biot5:      1.5e-5
    esm3_lora:  1.0e-5

  weight_decay: 1.5e-2
  adam_eps:     1.0e-8
  adam_betas:   [0.9, 0.999]

  scheduler:
    warmup_steps:       5
    biot5_warmup_steps: 10
    min_lr_ratio:       0.01

  early_stopping:
    monitor:   "val/r2"
    mode:      "max"
    patience:  2  # = max_epochs for probe; EarlyStopping effectively runs full duration
    min_delta: 0.001

  checkpoint:
    save_top_k: 2
    monitor:    "val/r2"
    mode:       "max"
    filename:   "epoch{epoch:03d}-r2{val/r2:.4f}"

logging:
  backend:           "none"
  wandb_project:     "kcat-prediction"
  wandb_entity:      null
  log_every_n_steps: 5
  log_gpu_memory:    true

evaluation:
  metrics:        ["r2", "rmse", "mae", "spearman", "pearson"]
  primary_metric: "r2"

reproducibility:
  deterministic: true
  benchmark:     false
